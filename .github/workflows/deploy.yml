name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Determine Astro deploy URLs
        id: astro-env
        shell: bash
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          SITE_URL_OVERRIDE: ${{ vars.SITE_URL }}
          ASTRO_BASE_OVERRIDE: ${{ vars.ASTRO_BASE }}
        run: |
          if [[ "$REPOSITORY_NAME" == "$REPOSITORY_OWNER.github.io" ]]; then
            default_site_url="https://${REPOSITORY_OWNER}.github.io"
            default_base_path="/"
          else
            default_site_url="https://${REPOSITORY_OWNER}.github.io"
            default_base_path="/${REPOSITORY_NAME}"
          fi

          echo "site_url=${SITE_URL_OVERRIDE:-$default_site_url}" >> "$GITHUB_OUTPUT"
          echo "base_path=${ASTRO_BASE_OVERRIDE:-$default_base_path}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build site
        run: npm run build
        env:
          SITE_URL: ${{ steps.astro-env.outputs.site_url }}
          ASTRO_BASE: ${{ steps.astro-env.outputs.base_path }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
